variables:
  GIT_CLEAN_FLAGS: none
  
stages:          # List of stages for jobs, and their order of execution
  - build
  - test

build:c10f2:       # This job runs in the build stage, which runs first.
  stage: build
  script:
    - echo "Compiling the code..."
    - git clean -ffdx
    - mkdir -p build
    - cmake -S . -B build -DIPC_EXEC_DIR=$(pwd)/build/ipc_bridge/ -DCMAKE_BUILD_TYPE=Debug -DOLD_CPPCHECK=1 -DSKIP_CLANG_FORMAT=1 -DSKIP_SENSITIVE=1 -DSKIP_CPP_CHECK=1 -DUSER_CERT_SERIAL=7c0023a5ddcca0871edc0f41bd000f0023a5dd -DUSER_CERT_SUBJECT="Test Certificate"  -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE -DCMAKE_C_COMPILER:FILEPATH=/usr/bin/clang -DCMAKE_CXX_COMPILER:FILEPATH=/usr/bin/clang++ --no-warn-unused-cli -G Ninja
    - cmake --build build
    - echo "Compile complete."
  needs: []
  tags:
    - C10f2
  parallel: 1
