unit-test-job:   # This job runs in the test stage.
  stage: test    # It only starts when the job in the build stage completes successfully.
  script:
    - echo "Running unit tests..."
    - pwd
    - $(pwd)/build/c_bridge/test/test_cbridge
    - $(pwd)/build/for_poppler/test/popl_test1
    - $(pwd)/build/pdf/test/test1
    - $(pwd)/build/pdf/test/test_sign 
    - $(pwd)/build/csp/test/csp_test1 
    - $(pwd)/build/csp/test/test_sign_helpers
    - $(pwd)/build/csp/test/test_valid_files
  tags: 
    - C10f2 



